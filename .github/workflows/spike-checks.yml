# Reusable managed spike checks for each caller-selected runner.
# Builds project paths individually because ABI tests require a local native package.

name: Spike Checks (reusable)

on:
  workflow_call:
    inputs:
      runner:
        type: string
        required: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  spike:
    name: Spike managed checks (${{ inputs.runner }})
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: false
      - name: Set up .NET
        uses: ./.github/actions/dotnet-setup
        with:
          extra-versions: 8.0.x
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Show .NET SDK information
        run: dotnet --info
      - name: Build managed spike projects
        run: |
          dotnet build spikes/binding-generators/clangsharp/postprocess/Janset.SDL2.PostProcess.csproj -c Release
          dotnet build spikes/binding-generators/clangsharp/src/Janset.SDL2.Core/Janset.SDL2.Core.csproj -c Release
          dotnet build spikes/binding-generators/clangsharp/src/Janset.SDL2.Image/Janset.SDL2.Image.csproj -c Release
          dotnet build spikes/binding-generators/clangsharp/src/Janset.SDL2.Gfx/Janset.SDL2.Gfx.csproj -c Release
          dotnet build spikes/binding-generators/clangsharp/src/Janset.SDL2.Ttf/Janset.SDL2.Ttf.csproj -c Release
          dotnet build spikes/binding-generators/clangsharp/src/Janset.SDL2.Mixer/Janset.SDL2.Mixer.csproj -c Release
          dotnet build spikes/binding-generators/clangsharp/tests/api-snapshot/ApiSnapshot.csproj -c Release
      - name: Postprocess self-test
        run: dotnet run --project spikes/binding-generators/clangsharp/postprocess/Janset.SDL2.PostProcess.csproj -c Release --no-build -- --self-test
      - name: Generator self-test
        run: python -B spikes/binding-generators/clangsharp/generate_bindings.py --self-test
      - name: Oracle self-test
        run: dotnet run --file spikes/binding-generators/clangsharp/oracle.cs -- --self-test
      - name: API snapshot tests
        run: dotnet test --project spikes/binding-generators/clangsharp/tests/api-snapshot/ApiSnapshot.csproj -c Release --no-build
        env:
          DiffEngine_Disabled: 'true'
