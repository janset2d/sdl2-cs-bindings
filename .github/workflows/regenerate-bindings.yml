# Manual binding regeneration runs GenerateBindings in the pinned Linux container.
# The reusable host build publishes cake-host; shared actions install .NET and
# download the host before regeneration. The vcpkg cache also preserves SDL2 source
# so the dynapi export manifest remains available after cache hits.
# Generated preview output is uploaded for download, inspection, and manual integration.

name: Regenerate Bindings

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  build-cake-host:
    # Reusable workflow shared with `release.yml`. Single host build avoids the regen
    # job paying the publish cost while it's already burning CPU on the parse loop.
    uses: ./.github/workflows/build-cake-host.yml

  regenerate:
    name: GenerateBindings (linux-x64)
    needs: [build-cake-host]
    runs-on: ubuntu-24.04
    container: ghcr.io/janset2d/sdl2-bindings-linux-builder:focal-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: ./.github/actions/dotnet-setup
        with:
          nuget-cache: 'false'
      - uses: ./.github/actions/platform-build-prereqs
      - uses: ./.github/actions/vcpkg-setup
        # Multi-path cache covers both binary cache + buildtrees/sdl2/src.
        # SDL2.exports lives in buildtrees and is the dynapi cross-check oracle —
        # vcpkg's binary cache does not preserve source extraction, so without
        # this caching the validator would fail on cache-hit runs.
        with:
          platform-identity: ghcr.io/janset2d/sdl2-bindings-linux-builder:focal-latest
          triplet: x64-linux-hybrid
          vcpkg-cache-path: .vcpkg-cache
          vcpkg-feature-flags: binarycaching
      - name: Cake Info
        uses: ./.github/actions/cake-host
        with:
          rid: linux-x64
      - name: Run GenerateBindings
        run: >
          dotnet ./cake-host/Build.dll
          --target GenerateBindings
          --rid linux-x64
      - name: Upload generated bindings preview
        uses: actions/upload-artifact@v7
        with:
          name: generated-bindings-preview
          path: artifacts/generated-bindings-preview/
          if-no-files-found: error
          retention-days: 7
