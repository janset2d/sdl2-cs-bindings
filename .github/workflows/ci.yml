name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # 1.7.12
        with:
          args: -color

  cake-host:
    name: Cake host (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, windows-2025-vs2026, macos-26]
    uses: ./.github/workflows/build-cake-host.yml
    with:
      runner: ${{ matrix.runner }}
      publish-artifact: false
      # The lint job runs the analyzer wall once.
      run-analyzers: false

  spike:
    name: Spike (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, windows-2025-vs2026, macos-26]
    uses: ./.github/workflows/spike-checks.yml
    with:
      runner: ${{ matrix.runner }}

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    env:
      # Every project that restores without the local package feed and is not frozen generator tooling.
      LINT_PROJECTS: >-
        build/_build/Build.csproj build/_build.Tests/Build.Tests.csproj
        src/SDL2.Core/SDL2.Core.csproj src/SDL2.Image/SDL2.Image.csproj src/SDL2.Gfx/SDL2.Gfx.csproj
        src/SDL2.Mixer/SDL2.Mixer.csproj src/SDL2.Ttf/SDL2.Ttf.csproj
        spikes/binding-generators/clangsharp/src/Janset.SDL2.Core/Janset.SDL2.Core.csproj
        spikes/binding-generators/clangsharp/src/Janset.SDL2.Image/Janset.SDL2.Image.csproj
        spikes/binding-generators/clangsharp/src/Janset.SDL2.Gfx/Janset.SDL2.Gfx.csproj
        spikes/binding-generators/clangsharp/src/Janset.SDL2.Ttf/Janset.SDL2.Ttf.csproj
        spikes/binding-generators/clangsharp/src/Janset.SDL2.Mixer/Janset.SDL2.Mixer.csproj
        spikes/binding-generators/clangsharp/tests/api-snapshot/ApiSnapshot.csproj
        build/analyzers/Janset.CodeStyle.Analyzers/Janset.CodeStyle.Analyzers.csproj
        build/analyzers/Janset.CodeStyle.Analyzers.Tests/Janset.CodeStyle.Analyzers.Tests.csproj
      FORMAT_EXCLUDE: external spikes/binding-generators/clangsharp/postprocess spikes/binding-generators/clangsharp/oracle.cs
    steps:
      - uses: actions/checkout@v7
      # Only the managed bindings need their pinned submodule sources.
      - run: |
          git -c url.https://github.com/.insteadOf=git@github.com: submodule update --init external/sdl2-cs
      - uses: ./.github/actions/dotnet-setup
      - run: dotnet tool restore
      - run: dotnet tool run slopwatch analyze --fail-on warning --exclude "artifacts/**,external/**,vcpkg_installed/**,**/bin/**,**/obj/**"
      - name: Restore, format check and build each project
        run: |
          read -r -a format_exclude <<< "$FORMAT_EXCLUDE"
          for p in $LINT_PROJECTS; do
            dotnet restore "$p"
            dotnet format whitespace "$p" --verify-no-changes --no-restore --exclude "${format_exclude[@]}"
            dotnet format style "$p" --verify-no-changes --no-restore --severity warn --exclude "${format_exclude[@]}"
            dotnet build "$p" -c Release --no-restore
          done
      - run: dotnet build tools.cs -c Release
      - run: dotnet test --project build/analyzers/Janset.CodeStyle.Analyzers.Tests/Janset.CodeStyle.Analyzers.Tests.csproj -c Release
