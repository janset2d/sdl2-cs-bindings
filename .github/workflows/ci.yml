name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  runners:
    uses: ./.github/workflows/runners.yml

  workflow-lint:
    name: Workflow lint
    needs: [runners]
    runs-on: ${{ needs.runners.outputs.utility }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # 1.7.12
        with:
          args: -color

  cake-host:
    name: Cake host (${{ matrix.runner }})
    needs: [runners]
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJson(needs.runners.outputs.legs) }}
    uses: ./.github/workflows/build-cake-host.yml
    with:
      runner: ${{ matrix.runner }}
      publish-artifact: false

  spike:
    name: Spike (${{ matrix.runner }})
    needs: [runners]
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJson(needs.runners.outputs.legs) }}
    uses: ./.github/workflows/spike-checks.yml
    with:
      runner: ${{ matrix.runner }}
