# Build and test the Cake host for ci.yml and release.yml.
# The runner input selects the OS; publish-artifact controls publishing and uploading
# the framework-dependent cake-host artifact for downstream jobs. CI disables it.
# Submodules are skipped because managed host tests do not build native code.
# TUnit HTML reports upload through the shared runtime-environment setup.

name: Build Cake Host (reusable)

on:
  workflow_call:
    inputs:
      runner:
        type: string
        required: true
      publish-artifact:
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    name: Build + Test Cake Host
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: false
      - uses: ./.github/actions/dotnet-setup
      - name: Enable TUnit HTML report auto-upload
        uses: ./.github/actions/tunit-report
      - name: Restore Build.Tests (transitive covers Build.csproj)
        # Targeted to the test project — NOT a solution-wide restore. `build/build.sln`
        # currently carries only Build + Build.Tests but future additions (extra test
        # projects, samples) would pull in work we don't want here. Build.Tests
        # ProjectReference'es Build.csproj so its restore graph covers the Cake host.
        run: dotnet restore build/_build.Tests/Build.Tests.csproj
      - name: Test Cake host
        run: >
          dotnet test --project build/_build.Tests/Build.Tests.csproj
          --configuration Release
          --no-restore
      - name: Publish Cake host (FDD, cross-OS)
        if: inputs.publish-artifact
        run: >
          dotnet publish build/_build/Build.csproj
          --configuration Release
          --no-restore
          -p:UseAppHost=false
          --output ./out/cake-host
      - name: Upload cake-host artifact
        if: inputs.publish-artifact
        uses: actions/upload-artifact@v7
        with:
          name: cake-host
          path: ./out/cake-host
          if-no-files-found: error
          retention-days: 1
